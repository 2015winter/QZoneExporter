<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../vendor/bootstrap-select/css/bootstrap-select.min.css">
    <link href="../css/popup.css" rel="stylesheet" type="text/css">
    <title>QQ空间导出助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <script src="../vendor/jquery/jquery.min.js"></script>
    <script src="../vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/bootstrap-select/js/bootstrap-select.min.js"></script>
    <script src="../vendor/bootstrap-select/js/i18n/defaults-zh_CN.min.js"></script>
    <script src="../vendor/lodash/lodash.min.js"></script>
</head>

<body>
    <div>
        <h5>QQ空间导出助手</h5>
        <div class="qz-info">
            <p>登录QQ：<span class="font-weight-bold font-italic" style="color: red" id="loginUin"></span></p>
            <p>备份QQ：<span class="font-weight-bold font-italic" style="color: red" id="targetUin"></span></p>
            <p>备份模式：<span class="font-weight-bold font-italic" style="color: red" id="userType"></span></p>
        </div>

        <p class="qz-section-title">选择要备份的模块</p>
        <div class="qz-modules">
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Messages" name="exportType" value="Messages" checked>
                <label class="custom-control-label" for="Messages">说说</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Blogs" name="exportType" value="Blogs" checked>
                <label class="custom-control-label" for="Blogs">日志</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Diaries" name="exportType" value="Diaries" checked>
                <label class="custom-control-label" for="Diaries">日记</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Photos" name="exportType" value="Photos" checked>
                <label class="custom-control-label" for="Photos">相册</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Videos" name="exportType" value="Videos" checked>
                <label class="custom-control-label" for="Videos">视频</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Boards" name="exportType" value="Boards" checked>
                <label class="custom-control-label" for="Boards">留言</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Friends" name="exportType" value="Friends" checked>
                <label class="custom-control-label" for="Friends">好友</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Favorites" name="exportType" value="Favorites" checked>
                <label class="custom-control-label" for="Favorites">收藏</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Shares" name="exportType" value="Shares" checked>
                <label class="custom-control-label" for="Shares">分享</label>
            </div>
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="Visitors" name="exportType" value="Visitors" checked>
                <label class="custom-control-label" for="Visitors">访客</label>
            </div>
        </div>

        <div id="export_albums_div" class="form-group" style="display: none;">
            <label for="export_albums" class="qz-tips mb-1">相册列表：</label>
            <select id="export_albums" class="form-control selectpicker" data-header="选择相册" data-live-search="true" multiple title="请选择相册" data-live-search-placeholder="搜索相册" data-actions-box="true" data-selected-text-format="count > 3">
                <optgroup label="分类">
                    <option value="1">相册一</option>
                    <option value="2">相册二</option>
                    <option value="3">相册三</option>
                </optgroup>
            </select>
        </div>

        <span id="diaries_tip" class="qz-tips" style="display: none;">日记已开启独立密码认证，请先<a id='diaries_close' target="_blank" style="color: red;">关闭</a></span>
        <span id="download_tools_tip" class="qz-tips">当前文件下载工具为
            <a id="download_tool_tip" class="download_tool_tip" href="javascript:void(0)" target="_blank">助手内部</a>
        </span>
        <span id="download_help_tip" class="qz-tips">
            <span id="download_help_reson">内部下载，限制较多已淘汰</span>， <a id='download_help_suggestion' class="download_tool" target="_blank">点击这里更换下载工具</a>
        </span>

        <div class="mt-3">
            <button id="backup" type="button" class="btn btn-primary btn-block-lg">开始备份</button>
        </div>

        <hr>

        <div class="qz-media-card">
            <p class="qz-section-title">📁 一键导出媒体到本地目录</p>
            <p class="qz-tips mb-2">仅导出相册照片 / 视频文件到你选择的本地文件夹，便于统一管理（上传网盘、拷贝硬盘或手机）。独立于上方备份，不含说说日志等文案。</p>
            <div class="qz-media-modules">
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="media_photos" checked>
                    <label class="custom-control-label" for="media_photos">相册照片</label>
                </div>
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="media_videos" checked>
                    <label class="custom-control-label" for="media_videos">视频</label>
                </div>
            </div>
            <div id="media_albums_div" class="form-group mb-2">
                <label for="media_albums" class="qz-tips mb-1">导出相册（独立选择，不选则全部）：</label>
                <select id="media_albums" class="form-control selectpicker" data-header="选择要导出的相册" data-live-search="true" multiple title="全部相册" data-live-search-placeholder="搜索相册" data-actions-box="true" data-selected-text-format="count > 3">
                </select>
            </div>
            <button id="mediaExport" type="button" class="btn btn-success btn-block-lg">选择文件夹并导出</button>
        </div>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/popup.js"></script>
</body>

</html>
