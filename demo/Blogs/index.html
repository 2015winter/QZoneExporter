<!DOCTYPE html>
<html lang="zh">

<head>
	<link rel="icon" href="../Common/images/favicon.ico"> 
	<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>QQ空间备份-日志 Demo</title>
	<link rel="stylesheet" href="../Common/vendor/css/font-awesome.min.css">
	<link rel="stylesheet" href="../Common/vendor/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="../Common/css/common.css">
	
	<link rel="stylesheet" type="text/css" href="../Common/css/theme.css">
	<link rel="stylesheet" type="text/css" href="../Common/css/components.css">
	<link rel="stylesheet" type="text/css" href="../Common/css/pages/blogs.css">
	<script src="../Common/js/theme.js"></script>
	<script src="../Common/vendor/js/jquery.min.js"></script>
	<script src="../Common/vendor/js/bootstrap.bundle.min.js"></script>
	<script src="../Common/vendor/js/lodash.min.js"></script>
	
	<script type="text/javascript" src="../Common/json/config.js"></script>
	<script type="text/javascript" src="json/blogs.js"></script>
	
	<style>
		/* 始终显示滚动条，避免切换时布局偏移 */
		html {
			overflow-y: scroll;
		}
		
		/* 滚动条常驻于 html，禁用 Bootstrap 弹窗对 body 的 padding-right 补偿，避免布局右移 */
		body.modal-open {
			padding-right: 0 !important;
		}
		
		/* 滚动边界隔离：阻断滚动链，避免弹窗滚动传导至背景页 */
		#blogModal,
		#blogModal .modal-body {
			overscroll-behavior: contain;
		}
		
		/* 提升为独立合成层并隔离堆叠上下文，避免滚动时与背景模糊层相互重绘 */
		#blogModal .modal-content {
			transform: translateZ(0);
			isolation: isolate;
		}
		
		#blogModal .modal-body {
			transform: translateZ(0);
			-webkit-backface-visibility: hidden;
			backface-visibility: hidden;
		}
		
		/* Demo 标记 */
		.demo-badge {
			position: fixed;
			top: 80px;
			right: 20px;
			background: linear-gradient(135deg, #ff6b6b, #ee5a24);
			color: #fff;
			padding: 8px 16px;
			border-radius: 20px;
			font-weight: 600;
			font-size: 14px;
			box-shadow: 0 4px 15px rgba(238, 90, 36, 0.4);
			z-index: 1000;
		}
		
		/* 日志详情弹窗正文样式 */
		#blogModalContent {
			line-height: 1.8;
			font-size: 16px;
			color: #2d3748;
		}
		
		#blogModalContent img {
			max-width: 100%;
			height: auto;
			border-radius: 8px;
			margin: 10px 0;
		}
		
		#blogModalContent p {
			margin-bottom: 12px;
		}
		
		/* 弹窗内评论区样式 */
		#blogModalComments .comments-section {
			margin-top: 32px;
			padding-top: 24px;
			border-top: 1px solid rgba(0, 0, 0, 0.08);
		}
		
		#blogModalComments .comments-header {
			margin-bottom: 20px;
		}
		
		#blogModalComments .comments-title {
			font-size: 18px;
			font-weight: 600;
			color: #2d3748;
			display: flex;
			align-items: center;
			gap: 10px;
		}
		
		#blogModalComments .comments-count {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 26px;
			height: 26px;
			padding: 0 10px;
			background: linear-gradient(135deg, #667eea, #764ba2);
			border-radius: 13px;
			font-size: 13px;
			font-weight: 600;
			color: #fff;
		}
		
		#blogModalComments .comment-card {
			background: linear-gradient(145deg, #f8fafc, #fff);
			border-radius: 14px;
			padding: 18px;
			margin-bottom: 14px;
			border: 1px solid rgba(0, 0, 0, 0.05);
		}
		
		#blogModalComments .comment-header {
			display: flex;
			align-items: flex-start;
			margin-bottom: 10px;
		}
		
		#blogModalComments .comment-avatar {
			width: 44px;
			height: 44px;
			flex-shrink: 0;
		}
		
		#blogModalComments .avatar-fallback {
			width: 100%;
			height: 100%;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #fff;
			font-weight: 600;
			background: linear-gradient(135deg, #667eea, #764ba2);
			border: 2px solid rgba(102, 126, 234, 0.2);
		}
		
		#blogModalComments .comment-info {
			margin-left: 12px;
			flex: 1;
		}
		
		#blogModalComments .comment-author {
			font-weight: 600;
			color: #2d3748;
			text-decoration: none;
		}
		
		#blogModalComments .comment-floor {
			display: inline-block;
			padding: 2px 8px;
			background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
			border-radius: 10px;
			font-size: 11px;
			font-weight: 600;
			color: #667eea;
			margin-left: 8px;
		}
		
		#blogModalComments .comment-time {
			font-size: 12px;
			color: #a0aec0;
			margin-top: 4px;
		}
		
		#blogModalComments .comment-body {
			color: #4a5568;
			line-height: 1.7;
			padding-left: 56px;
		}
		
		#blogModalComments .comment-body p {
			margin-bottom: 8px;
		}
		
		#blogModalComments .reply-list {
			margin-top: 14px;
			padding-left: 56px;
		}
		
		#blogModalComments .reply-card {
			background: rgba(102, 126, 234, 0.05);
			border-radius: 12px;
			padding: 14px;
			margin-bottom: 10px;
			border-left: 3px solid rgba(102, 126, 234, 0.3);
		}
		
		#blogModalComments .reply-header {
			display: flex;
			align-items: center;
			margin-bottom: 8px;
		}
		
		#blogModalComments .reply-avatar {
			width: 34px;
			height: 34px;
			flex-shrink: 0;
		}
		
		#blogModalComments .reply-avatar .avatar-fallback {
			font-size: 13px;
		}
		
		#blogModalComments .reply-info {
			margin-left: 10px;
		}
		
		#blogModalComments .reply-body {
			padding-left: 44px;
			color: #4a5568;
			font-size: 14px;
		}
		
		#blogModalComments .no-comments {
			text-align: center;
			padding: 30px 20px;
			color: #a0aec0;
		}
		
		#blogModalComments .no-comments i {
			font-size: 40px;
			margin-bottom: 12px;
			opacity: 0.5;
			display: block;
		}
	</style>
</head>

<body class="blogs-page">
	<!-- Demo 标记 -->
	<div class="demo-badge">
		<i class="fa fa-star mr-1"></i>Demo 演示
	</div>
	
	<header>
		<nav class="navbar navbar-dark page-navbar blogs-navbar">
			<a class="navbar-brand" href="../index.html">
				<i class="fa fa-cloud-download mr-2"></i>QQ空间导出助手
			</a>
			<nav aria-label="breadcrumb">
					<ol class="breadcrumb blogs-breadcrumb">
						<li class="breadcrumb-item"><a href="../index.html"><i class="fa fa-home mr-1"></i>个人中心</a></li>
						<li class="breadcrumb-item active"><i class="fa fa-book mr-1"></i>日志</li>
					</ol>
				</nav>
		</nav>
	</header>
	
	<main role="main" class="flex-shrink-0">
		<div class="container">
			<div class="blogs-main-card">
				<!-- 页面标题 -->
				<div class="blogs-header">
					<i class="fa fa-book blogs-header-icon"></i>
					<h1 class="blogs-header-title">我的日志</h1>
					<p class="blogs-header-subtitle">共 <span class="blogs-total-count" id="totalCount">0</span> 篇日志</p>
				</div>
				
				<!-- 分类标签 -->
				<div class="blogs-categories" id="categories">
					<!-- 由JS动态生成 -->
				</div>
				
				<!-- 工具栏 -->
				<div class="blogs-toolbar">
					<div class="blogs-search">
						<i class="fa fa-search"></i>
						<input type="text" id="blogs-search-input" placeholder="搜索日志标题...">
					</div>
					<div class="blogs-sort">
						<button class="sort-btn active" data-sort="time-desc">
							<i class="fa fa-sort-amount-desc mr-1"></i>最新
						</button>
						<button class="sort-btn" data-sort="time-asc">
							<i class="fa fa-sort-amount-asc mr-1"></i>最早
						</button>
						<button class="sort-btn" data-sort="view-desc">
							<i class="fa fa-eye mr-1"></i>最多浏览
						</button>
					</div>
				</div>
				
				<!-- 日志列表 -->
				<div class="blogs-grid" id="blogsList">
					<!-- 由JS动态生成 -->
				</div>
			</div>
		</div>
	</main>
	
	<!-- 日志详情弹窗 -->
	<div class="modal fade" id="blogModal" tabindex="-1">
		<div class="modal-dialog modal-lg modal-dialog-scrollable">
			<div class="modal-content" style="border-radius: 20px; overflow: hidden;">
				<div class="modal-header" style="background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;">
					<h5 class="modal-title" id="blogModalTitle">日志标题</h5>
					<button type="button" class="close text-white" data-dismiss="modal">
						<span>&times;</span>
					</button>
				</div>
				<div class="modal-body" style="padding: 30px;">
					<!-- 日志正文 -->
					<div id="blogModalContent"></div>
					<!-- 评论区 -->
					<div id="blogModalComments"></div>
				</div>
				<div class="modal-footer">
					<span class="text-muted mr-auto" id="blogModalMeta"></span>
					<button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
				</div>
			</div>
		</div>
	</div>
	
	<footer class="footer mt-auto py-3 page-footer blogs-footer">
		<div class="container text-center">
			<span class="text-white footer-text">
				<i class="fa fa-leaf mr-2"></i>落叶随风，青春，稍纵即逝
			</span>
		</div>
	</footer>
	
	<script>
		// 全局状态
		let filteredBlogs = [...blogs];
		let currentCategory = 'all';
		let currentSort = 'time-desc';
		
		// 获取排序用的时间戳
		function getBlogTimestamp(blog) {
			const time = blog.pubTime || blog.pubtime;
			if (!time) return 0;
			
			if (typeof time === 'string') {
				return new Date(time).getTime() || 0;
			}
			if (typeof time === 'number') {
				return time < 10000000000 ? time * 1000 : time;
			}
			return 0;
		}
		
		// 渲染日志列表
		function renderBlogs() {
			const container = document.getElementById('blogsList');
			const categoriesContainer = document.getElementById('categories');
			
			// 统计分类
			const categories = {};
			blogs.forEach(blog => {
				const cat = blog.category || '未分类';
				categories[cat] = (categories[cat] || 0) + 1;
			});
			
			// 渲染分类标签
			let catHtml = `<a class="category-tag active" data-category="all">全部 <span class="count">${blogs.length}</span></a>`;
			Object.keys(categories).forEach(cat => {
				catHtml += `<a class="category-tag" data-category="${cat}">${cat} <span class="count">${categories[cat]}</span></a>`;
			});
			categoriesContainer.innerHTML = catHtml;
			
			document.getElementById('totalCount').textContent = blogs.length;
			
			// 绑定分类筛选
			document.querySelectorAll('.category-tag').forEach(tag => {
				tag.addEventListener('click', function() {
					document.querySelectorAll('.category-tag').forEach(t => t.classList.remove('active'));
					this.classList.add('active');
					currentCategory = this.dataset.category;
					filterAndSort();
				});
			});
			
			// 绑定排序按钮
			document.querySelectorAll('.sort-btn').forEach(btn => {
				btn.addEventListener('click', function() {
					document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
					this.classList.add('active');
					currentSort = this.dataset.sort;
					filterAndSort();
				});
			});
			
			// 绑定搜索
			let searchTimer;
			document.getElementById('blogs-search-input').addEventListener('input', function() {
				clearTimeout(searchTimer);
				searchTimer = setTimeout(filterAndSort, 300);
			});
			
			// 初始渲染
			filterAndSort();
		}
		
		// 筛选和排序
		function filterAndSort() {
			// 筛选分类
			if (currentCategory === 'all') {
				filteredBlogs = [...blogs];
			} else {
				filteredBlogs = blogs.filter(b => (b.category || '未分类') === currentCategory);
			}
			
			// 搜索
			const searchText = document.getElementById('blogs-search-input').value.trim().toLowerCase();
			if (searchText) {
				filteredBlogs = filteredBlogs.filter(b => (b.title || '').toLowerCase().includes(searchText));
			}
			
			// 排序
			filteredBlogs.sort((a, b) => {
				switch (currentSort) {
					case 'time-desc':
						return getBlogTimestamp(b) - getBlogTimestamp(a);
					case 'time-asc':
						return getBlogTimestamp(a) - getBlogTimestamp(b);
					case 'view-desc':
						const aView = (a.custom_visitor && a.custom_visitor.viewCount) || 0;
						const bView = (b.custom_visitor && b.custom_visitor.viewCount) || 0;
						return bView - aView;
					default:
						return 0;
				}
			});
			
			renderBlogsGrid();
		}
		
		// 渲染日志卡片
		function renderBlogsGrid() {
			const container = document.getElementById('blogsList');
			
			if (filteredBlogs.length === 0) {
				container.innerHTML = '<div class="blogs-empty"><i class="fa fa-book"></i><p>暂无日志</p></div>';
				return;
			}
			
			let html = '';
			filteredBlogs.forEach(blog => {
				const isRepost = blog.effect === 1;
				html += `
					<div class="blog-card" data-category="${blog.category}" onclick="showBlog('${blog.blogid}')">
						${isRepost ? '<div class="blog-labels"><span class="blog-label repost">转载</span></div>' : '<div class="blog-labels"><span class="blog-label original">原创</span></div>'}
						<h3 class="blog-title">${blog.title}</h3>
						<span class="blog-category">${blog.category}</span>
						<div class="blog-meta">
							<span class="blog-time"><i class="fa fa-clock-o"></i>${blog.pubTime}</span>
							<div class="blog-stats">
								<span><i class="fa fa-eye"></i> ${blog.custom_visitor?.viewCount || 0}</span>
								<span><i class="fa fa-comment"></i> ${blog.replynum || 0}</span>
							</div>
						</div>
					</div>
				`;
			});
			container.innerHTML = html;
		}
		
		// 显示日志详情
		function showBlog(blogid) {
			const blog = blogs.find(b => b.blogid === blogid);
			if (!blog) return;
			
			const isRepost = blog.effect === 1;
			
			document.getElementById('blogModalTitle').textContent = blog.title;
			document.getElementById('blogModalContent').innerHTML = blog.content;
			document.getElementById('blogModalMeta').innerHTML = `
				<i class="fa fa-tag mr-1"></i>${isRepost ? '转载' : '原创'} · 
				<i class="fa fa-folder-o mr-1"></i>${blog.category} · 
				<i class="fa fa-clock-o mr-1"></i>${blog.pubTime} · 
				<i class="fa fa-eye mr-1"></i>${blog.custom_visitor?.viewCount || 0} · 
				<i class="fa fa-comment mr-1"></i>${blog.replynum || 0}
			`;
			
			// 渲染评论区
			renderComments(blog);
			
			$('#blogModal').modal('show');
		}
		
		// HTML 转义
		function escapeHtml(str) {
			return String(str == null ? '' : str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;');
		}
		
		// 头像占位：取昵称首字
		function avatarFallback(name) {
			const ch = (name || '匿').trim().charAt(0) || '匿';
			return `<div class="avatar-fallback">${escapeHtml(ch)}</div>`;
		}
		
		// 渲染评论区
		function renderComments(blog) {
			const comments = blog.comments || [];
			let html = '<div class="comments-section">';
			html += `<div class="comments-header"><div class="comments-title"><i class="fa fa-comments"></i>评论 <span class="comments-count">${comments.length}</span></div></div>`;
			
			if (comments.length === 0) {
				html += '<div class="no-comments"><i class="fa fa-comment-o"></i><p>暂无评论</p></div>';
			} else {
				comments.forEach((comment, index) => {
					html += '<div class="comment-card">';
					html += '<div class="comment-header">';
					html += `<div class="comment-avatar">${avatarFallback(comment.name)}</div>`;
					html += '<div class="comment-info">';
					html += `<div><span class="comment-author">${escapeHtml(comment.name)}</span><span class="comment-floor">#${index + 1}</span></div>`;
					html += `<div class="comment-time"><i class="fa fa-clock-o mr-1"></i>${escapeHtml(comment.time)}</div>`;
					html += '</div></div>';
					html += `<div class="comment-body"><p>${escapeHtml(comment.content)}</p></div>`;
					
					const replies = comment.replies || [];
					if (replies.length > 0) {
						html += '<div class="reply-list">';
						replies.forEach(reply => {
							html += '<div class="reply-card">';
							html += '<div class="reply-header">';
							html += `<div class="reply-avatar">${avatarFallback(reply.name)}</div>`;
							html += '<div class="reply-info">';
							html += `<div><span class="comment-author">${escapeHtml(reply.name)}</span></div>`;
							html += `<div class="comment-time"><i class="fa fa-clock-o mr-1"></i>${escapeHtml(reply.time)}</div>`;
							html += '</div></div>';
							html += `<div class="reply-body"><p>${escapeHtml(reply.content)}</p></div>`;
							html += '</div>';
						});
						html += '</div>';
					}
					html += '</div>';
				});
			}
			html += '</div>';
			document.getElementById('blogModalComments').innerHTML = html;
		}
		
		// 初始化
		document.addEventListener('DOMContentLoaded', renderBlogs);
	</script>
</body>

</html>
